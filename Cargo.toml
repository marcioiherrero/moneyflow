[package]
name = "moneyflow"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.16.0"
bcrypt = "0.19.3"

# dotenvy adiciona suporte a arquivos .env
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0",
  default-features = false,
  features = [
    "rust_crypto"
  ]
}

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "chrono"
] }
tokio = { version = "1.53.2", features = ["full"] }

# Isso permite otimizações completas para as macros do SQLx,
# mesmo durante o desenvolvimento.
# As otimizações são habilitadas automaticamente ao compilar
# no modo de release.
[profile.dev.package.sqlx-macros]
opt-level = 3
